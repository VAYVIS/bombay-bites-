<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dashboard - Bombay Bites</title>
<link rel="stylesheet" href="css/style.css" />
<script>
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
</script>
</head>
<body>

<div class="app-layout">
<!-- SIDEBAR -->
<aside class="sidebar">
<div class="logo brand-font" style="padding: 0 20px 24px;">🍛 Bombay Bites</div>
<nav class="sidebar-links">
<a href="dashboard.html" class="active">📊 Dashboard</a>
<a href="menu.html">🍽️ Menu</a>
<a href="orders.html">🧾 Orders</a>
<a href="billing.html">📄 Billing</a>
<a href="profile.html">👤 Profile</a>
</nav>
<button id="logoutBtn" class="btn btn-outline" style="margin: 20px;">Logout</button>
</aside>

<!-- MAIN CONTENT -->
<div class="main-content">
<nav class="navbar">
<div class="brand-font" style="font-size:18px;">Dashboard</div>
<div style="display:flex; align-items:center; gap:16px;">
<span id="userEmail" class="text-muted" style="font-size:13px;"></span>
<button id="themeToggle" class="theme-toggle">🌙</button>
</div>
</nav>

<div class="content-area">
<h1 class="brand-font" style="margin-bottom: 24px;"><span class="heading-line"><span class="page-heading">Welcome back 👋</span></span></h1>

<div id="statsGrid" class="stats-grid">
<div class="card stat-card">
<p class="text-muted">Total Orders</p>
<h2 id="statTotalOrders">—</h2>
</div>
<div class="card stat-card">
<p class="text-muted">Pending Orders</p>
<h2 id="statPendingOrders">—</h2>
</div>
<div class="card stat-card">
<p class="text-muted">Menu Items</p>
<h2 id="statMenuItems">—</h2>
</div>
<div class="card stat-card">
<p class="text-muted">Today's Revenue</p>
<h2 id="statRevenue">—</h2>
</div>
</div>

<div class="card" style="margin-top: 24px;">
<h3 style="margin-bottom:16px;">Recent Orders</h3>
<div id="recentOrdersList">
<p class="text-muted">Loading...</p>
</div>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/theme.js"></script>
<script type="module" src="js/interactions.js"></script>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
