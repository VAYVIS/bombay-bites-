<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In - Bombay Bites</title>
<link rel="stylesheet" href="css/style.css" />
<!-- change this to the real filename of your landing page stylesheet -->
<link rel="stylesheet" href="css/landing.css" />
<link rel="stylesheet" href="css/login.css" />
<script>
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
</script>
</head>
<body class="landing login-page">

<!-- background: same blobs + floating food as the landing page -->
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="bg-blob blob-3"></div>
<div class="floaters" aria-hidden="true">
  <span>🍛</span><span>🥘</span><span>🍲</span><span>🥭</span><span>🍢</span>
</div>

<nav class="land-nav">
  <a href="index.html" class="home-btn"><span class="home-icon">🏠</span><span>Home</span></a>
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
</nav>

<main class="login-stage">
  <div class="auth-card login-card">
    <h2 class="brand-font login-title">Welcome Back</h2>
    <p class="auth-sub">Sign in to manage menu, orders and billing.</p>

    <div id="loginError" class="error-msg" role="alert" style="display:none;"></div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" required placeholder="Your password" autocomplete="current-password" />
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">👁</button>
      </div>

      <button type="submit" class="land-btn primary-grad login-submit" id="loginBtn">Sign In</button>
    </form>

    <p class="auth-foot">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/theme.js"></script>
<script type="module" src="js/interactions.js"></script>
<script type="module" src="js/login-ui.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
