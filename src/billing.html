<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Billing - Bombay Bites</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/billing.css" />
<script>
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
</script>
</head>
<body>

<div class="app-layout">
<aside class="sidebar">
<div class="logo brand-font" style="padding: 0 20px 24px;">🍛 Bombay Bites</div>
<nav class="sidebar-links">
<a href="dashboard.html">📊 Dashboard</a>
<a href="menu.html">🍽️ Menu</a>
<a href="orders.html">🧾 Orders</a>
<a href="billing.html" class="active">📄 Billing</a>
<a href="profile.html">👤 Profile</a>
</nav>
<button id="logoutBtn" class="btn btn-outline" style="margin: 20px;">Logout</button>
</aside>

<div class="main-content">
<nav class="navbar">
<div class="brand-font" style="font-size:18px;">Billing</div>
<div style="display:flex; align-items:center; gap:16px;">
<span id="userEmail" class="text-muted" style="font-size:13px;"></span>
<button id="themeToggle" class="theme-toggle">🌙</button>
</div>
</nav>

<div class="content-area">
<h1 class="brand-font" style="margin-bottom: 24px;"><span class="heading-line"><span class="page-heading">Bills &amp; Payments</span></span></h1>

<div id="billingError" class="error-msg" style="display:none;"></div>

<div class="stats-grid">
<div class="card stat-card">
<p class="text-muted">Today's Revenue</p>
<h2 id="statToday">—</h2>
</div>
<div class="card stat-card">
<p class="text-muted">Total Revenue</p>
<h2 id="statTotal">—</h2>
</div>
<div class="card stat-card">
<p class="text-muted">Bills Paid</p>
<h2 id="statCount">—</h2>
</div>
<div class="card stat-card">
<p class="text-muted">Average Bill</p>
<h2 id="statAverage">—</h2>
</div>
<div class="card stat-card">
<p class="text-muted">Awaiting Payment</p>
<h2 id="statUnpaid">—</h2>
</div>
</div>

<div class="card" style="margin-top: 24px;">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;">
<h3>Paid Bills</h3>
<div style="display:flex; gap:10px; flex-wrap:wrap;">
<input type="text" id="billSearch" placeholder="🔍 Search by customer, table, staff or bill no..." style="margin:0; width:280px;" />
<select id="methodFilter" style="width:auto; margin:0; padding:8px 12px;">
<option value="all">All payment methods</option>
<option value="cash">Cash</option>
<option value="upi">UPI</option>
<option value="card">Card</option>
</select>
</div>
</div>

<div class="table-wrap">
<table class="bill-table">
<thead>
<tr>
<th>Bill No</th>
<th>Customer</th>
<th>Table</th>
<th>Staff</th>
<th>Method</th>
<th>Paid On</th>
<th style="text-align:right;">Amount</th>
<th></th>
</tr>
</thead>
<tbody id="billsBody">
<tr><td colspan="8" class="text-muted">Loading bills...</td></tr>
</tbody>
</table>
</div>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/theme.js"></script>
<script type="module" src="js/interactions.js"></script>
<script type="module" src="js/billing.js"></script>
</body>
</html>
