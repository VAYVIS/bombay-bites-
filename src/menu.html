<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Menu - Bombay Bites</title>
<link rel="stylesheet" href="css/style.css" />
<script>
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
</script>
</head>
<body>

<div class="app-layout">
<!-- SIDEBAR (shared) -->
<aside class="sidebar" id="sidebar"></aside>
<script src="js/sidebar.js"></script>

<div class="main-content">
<nav class="navbar">
<div class="brand-font" style="font-size:18px;">Menu Management</div>
<div style="display:flex; align-items:center; gap:16px;">
<span id="userEmail" class="text-muted" style="font-size:13px;"></span>
<button id="themeToggle" class="theme-toggle">🌙</button>
</div>
</nav>

<div class="content-area">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
<h1 class="brand-font">Menu Items</h1>
<button id="openAddModal" class="btn btn-primary">+ Add Item</button>
</div>

<div id="menuError" class="error-msg" style="display:none;"></div>

<div id="menuGrid" class="menu-grid">
<p class="text-muted">Loading menu...</p>
</div>
</div>
</div>
</div>

<!-- ADD/EDIT MODAL -->
<div id="menuModal" class="modal-overlay" style="display:none;">
<div class="card modal-box">
<h2 id="modalTitle" class="brand-font" style="margin-bottom:20px;">Add Menu Item</h2>

<div id="modalError" class="error-msg" style="display:none;"></div>

<form id="menuForm">
<input type="hidden" id="itemId" />

<label for="itemName">Item Name</label>
<input type="text" id="itemName" required placeholder="e.g. Vada Pav" />

<label for="itemDescription">Description</label>
<input type="text" id="itemDescription" placeholder="Short description" />

<label for="itemPrice">Price (₹)</label>
<input type="number" id="itemPrice" required min="0" step="0.01" placeholder="e.g. 25" />

<label for="itemCategory">Category</label>
<select id="itemCategory">
<option value="">Select category</option>
</select>

<label for="itemImageFile">Image (max 2 MB)</label>
<input type="file" id="itemImageFile" accept="image/*" />
<img id="imagePreview" alt="Image preview" style="display:none; width:100%; height:140px; object-fit:cover; border-radius:8px; margin:8px 0 12px;" />

<label for="itemImage">Or image URL</label>
<input type="text" id="itemImage" placeholder="https://..." />

<label style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
<input type="checkbox" id="itemAvailable" checked style="width:auto; margin:0;" />
Available
</label>

<div style="display:flex; gap:12px;">
<button type="submit" class="btn btn-primary" id="saveBtn" style="flex:1;">Save</button>
<button type="button" id="closeModal" class="btn btn-outline" style="flex:1;">Cancel</button>
</div>
</form>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/theme.js"></script>
<script type="module" src="js/interactions.js"></script>
<script type="module" src="js/menu.js"></script>
</body>
</html>
