<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Menu - Bombay Bites</title>
<link rel="stylesheet" href="css/style.css" />
<script>
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
</script>
</head>
<body>

<div class="app-layout">
<aside class="sidebar">
<div class="logo brand-font" style="padding: 0 20px 24px;">🍛 Bombay Bites</div>
<nav class="sidebar-links">
<a href="dashboard.html">📊 Dashboard</a>
<a href="menu.html" class="active">🍽️ Menu</a>
<a href="orders.html">🧾 Orders</a>
<a href="billing.html">📄 Billing</a>
<a href="profile.html">👤 Profile</a>
</nav>
<button id="logoutBtn" class="btn btn-outline" style="margin: 20px;">Logout</button>
</aside>

<div class="main-content">
<nav class="navbar">
<div class="brand-font" style="font-size:18px;">Menu Management</div>
<div style="display:flex; align-items:center; gap:16px;">
<span id="userEmail" class="text-muted" style="font-size:13px;"></span>
<button id="themeToggle" class="theme-toggle">🌙</button>
</div>
</nav>

<div class="content-area">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
<h1 class="brand-font"><span class="heading-line"><span class="page-heading">Menu Items</span></span></h1>
<div style="display:flex; gap:10px;">
<button id="openCategoryModal" class="btn btn-outline">🏷️ Categories</button>
<button id="openAddModal" class="btn btn-primary">+ Add Item</button>
</div>
</div>

<input type="text" id="menuSearch" placeholder="🔍 Search menu by name or category..." style="margin-bottom:20px;" />

<div id="menuError" class="error-msg" style="display:none;"></div>

<div id="menuGrid" class="menu-grid">
<p class="text-muted">Loading menu...</p>
</div>
</div>
</div>
</div>

<!-- ADD/EDIT MODAL -->
<div id="menuModal" class="modal-overlay" style="display:none;">
<div class="card modal-box">
<h2 id="modalTitle" class="brand-font" style="margin-bottom:20px;">Add Menu Item</h2>

<div id="modalError" class="error-msg" style="display:none;"></div>

<form id="menuForm">
<input type="hidden" id="itemId" />

<label for="itemName">Item Name</label>
<input type="text" id="itemName" required placeholder="e.g. Vada Pav" />

<label for="itemDescription">Description</label>
<textarea id="itemDescription" rows="3" placeholder="Short description"></textarea>

<label for="itemPrice">Price (₹)</label>
<input type="number" id="itemPrice" step="0.01" min="0" required placeholder="e.g. 60" />

<label for="itemCategory">Category</label>
<select id="itemCategory" required>
<option value="">Select category</option>
</select>

<label for="itemImageFile">Item Image</label>
<input type="hidden" id="itemImage" />
<img id="imagePreview" alt="Image preview" style="display:none; width:100%; height:140px; object-fit:cover; border-radius:8px; margin-bottom:10px;" />
<input type="file" id="itemImageFile" accept="image/png,image/jpeg,image/webp" />
<p class="text-muted" style="font-size:12px; margin:-6px 0 14px;">JPG, PNG or WEBP, up to 2 MB.</p>

<label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
<input type="checkbox" id="itemAvailable" style="width:auto; margin:0;" checked />
          Available
</label>

<div style="display:flex; gap:12px; margin-top:20px;">
<button type="submit" class="btn btn-primary" id="saveBtn" style="flex:1;">Save</button>
<button type="button" id="closeModal" class="btn btn-outline" style="flex:1;">Cancel</button>
</div>
</form>
</div>
</div>

<!-- CATEGORY MANAGEMENT MODAL -->
<div id="categoryModal" class="modal-overlay" style="display:none;">
<div class="card modal-box">
<h2 class="brand-font" style="margin-bottom:16px;">Manage Categories</h2>

<div id="categoryError" class="error-msg" style="display:none;"></div>

<form id="newCategoryForm" style="display:flex; gap:10px; margin-bottom:18px;">
<input type="text" id="newCategoryName" placeholder="e.g. Bombay Street Food" required style="margin:0; flex:1;" />
<button type="submit" class="btn btn-primary" style="white-space:nowrap;">+ Add</button>
</form>

<div id="categoryList" style="display:flex; flex-direction:column; gap:8px; max-height:320px; overflow-y:auto;">
<p class="text-muted">Loading categories...</p>
</div>

<button type="button" id="closeCategoryModal" class="btn btn-outline" style="width:100%; margin-top:18px;">Close</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/theme.js"></script>
<script type="module" src="js/interactions.js"></script>
<script type="module" src="js/menu.js"></script>
</body>
</html>
