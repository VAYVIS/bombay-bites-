<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Sign Up - Bombay Bites</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/landing.css" />
  <link rel="stylesheet" href="css/login.css" />

  <script>
    document.documentElement.setAttribute(
      'data-theme',
      localStorage.getItem('theme') || 'light'
    );
  </script>
</head>

<body class="landing login-page">

  <!-- Background blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <!-- Floating food -->
  <div class="floaters" aria-hidden="true">
    <span>🍛</span>
    <span>🥘</span>
    <span>🍲</span>
    <span>🥭</span>
    <span>🍢</span>
  </div>

  <!-- Navigation -->
  <nav class="land-nav">

    <a href="index.html" class="home-btn">
      <span class="home-icon">🏠</span>
      <span>Home</span>
    </a>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
      aria-label="Toggle dark mode"
    >
      🌙
    </button>

  </nav>

  <!-- Signup area -->
  <main class="login-stage">

    <div class="auth-card login-card">

      <!-- Heading -->
      <h2 class="brand-font login-title">
        Create Account
      </h2>

      <p class="auth-sub">
        Sign up to manage menu, orders and billing.
      </p>

      <!-- Error message -->
      <div
        id="signupError"
        class="error-msg"
        role="alert"
        style="display: none;"
      ></div>

      <!-- Success message -->
      <div
        id="signupSuccess"
        class="success-msg"
        role="status"
        style="display: none;"
      ></div>

      <!-- Signup form -->
      <form id="signupForm">

        <!-- Full Name -->
        <label for="fullName">
          Full Name
        </label>

        <input
          type="text"
          id="fullName"
          required
          placeholder="e.g. Rohan Shah"
          autocomplete="name"
        />

        <!-- Email -->
        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          required
          placeholder="you@example.com"
          autocomplete="email"
        />

        <!-- Password -->
        <label for="password">
          Password
        </label>

        <div class="pw-wrap">

          <input
            type="password"
            id="password"
            required
            placeholder="Minimum 6 characters"
            minlength="6"
            autocomplete="new-password"
          />

          <button
            type="button"
            class="pw-toggle"
            id="pwToggle"
            aria-label="Show password"
          >
            👁
          </button>

        </div>

        <!-- Sign Up button -->
        <button
          type="submit"
          class="land-btn primary-grad login-submit"
          id="signupBtn"
        >
          Sign Up
        </button>

      </form>

      <!-- Login link -->
      <p class="auth-foot">
        Already have an account?
        <a href="login.html">Sign In</a>
      </p>

    </div>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Existing scripts -->
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/interactions.js"></script>
  <script type="module" src="js/auth.js"></script>

  <!-- Password Show / Hide -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {

      const passwordInput = document.getElementById('password');
      const pwToggle = document.getElementById('pwToggle');

      if (!passwordInput || !pwToggle) {
        return;
      }

      pwToggle.addEventListener('click', function () {

        if (passwordInput.type === 'password') {

          passwordInput.type = 'text';

          pwToggle.textContent = '🙈';
          pwToggle.setAttribute(
            'aria-label',
            'Hide password'
          );

        } else {

          passwordInput.type = 'password';

          pwToggle.textContent = '👁';
          pwToggle.setAttribute(
            'aria-label',
            'Show password'
          );

        }

      });

    });
  </script>

</body>
</html>
