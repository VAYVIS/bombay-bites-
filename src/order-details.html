<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Order Details - Bombay Bites</title>
<link rel="stylesheet" href="css/style.css" />
<script>
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
</script>
</head>
<body>

<div class="app-layout">
<aside class="sidebar">
<div class="logo brand-font" style="padding: 0 20px 24px;">🍛 Bombay Bites</div>
<nav class="sidebar-links">
<a href="dashboard.html">📊 Dashboard</a>
<a href="menu.html">🍽️ Menu</a>
<a href="orders.html" class="active">🧾 Orders</a>
<a href="billing.html">📄 Billing</a>
<a href="profile.html">👤 Profile</a>
</nav>
<button id="logoutBtn" class="btn btn-outline" style="margin: 20px;">Logout</button>
</aside>

<div class="main-content">
<nav class="navbar">
<div class="brand-font" style="font-size:18px;">Order Details</div>
<div style="display:flex; align-items:center; gap:16px;">
<span id="userEmail" class="text-muted" style="font-size:13px;"></span>
<button id="themeToggle" class="theme-toggle">🌙</button>
</div>
</nav>

<div class="content-area">
<a href="orders.html" class="text-muted" style="font-size:13px;">← Back to Orders</a>

<div class="card" style="margin: 16px 0;">
<h2 id="orderCustomer" class="brand-font">Loading...</h2>
<p id="orderMeta" class="text-muted" style="font-size:13px; margin-top:4px;"></p>
</div>

<div id="itemsError" class="error-msg" style="display:none;"></div>

<div class="card" style="margin-bottom:16px;">
<h3 style="margin-bottom:12px;">Menu</h3>
<div id="menuGridSelect" class="menu-grid">
<p class="text-muted">Loading menu...</p>
</div>
</div>

<div class="card">
<h3 style="margin-bottom:12px;">Items in this Order</h3>
<div id="orderItemsList">
<p class="text-muted">Loading items...</p>
</div>
<div style="border-top:1px solid var(--border-color); margin-top:12px; padding-top:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
<a id="checkoutBtn" href="orders.html" class="btn btn-primary">💳 Proceed to Checkout</a>
<strong>Total: ₹<span id="grandTotal">0.00</span></strong>
</div>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/theme.js"></script>
<script type="module" src="js/interactions.js"></script>
<script type="module" src="js/order-details.js"></script>
<script>
  // Point the Checkout button at this order
  (function () {
    var id = new URLSearchParams(window.location.search).get('id');
    if (id) document.getElementById('checkoutBtn').href = 'checkout.html?id=' + id;
  })();
</script>
</body>
</html>
